name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aep
          POSTGRES_PASSWORD: aep
          POSTGRES_DB: aep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aep -d aep_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AEP_TEST_DATABASE_URL: postgresql://aep:aep@localhost:5432/aep_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Start the local stack for browser acceptance
        working-directory: .
        run: |
          make up
          docker compose up -d --wait
      - name: Create, approve and reject runs against the real backend
        id: live_acceptance
        env:
          AEP_LIVE_BASE_URL: http://localhost:3000
          AEP_CAPTURE_SCREENSHOTS: "1"
        run: |
          rm -f docs/screenshots/*.png
          npm run test:live
      - name: Upload workbench screenshots
        if: ${{ always() && steps.live_acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: chat-workbench-screenshots
          path: frontend/docs/screenshots/
          if-no-files-found: error
      - name: Stop the browser acceptance stack
        if: always()
        working-directory: .
        run: docker compose down -v

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --project connectors/postgres
      - run: uv run --frozen --project connectors/postgres ruff check connectors/postgres
      - run: uv run --frozen --project connectors/postgres ruff format --check connectors/postgres
      - run: docker compose up --build -d --wait source-postgres connector-postgres
      - run: uv run --frozen --project connectors/postgres pytest connectors/postgres/tests -q
      - run: uv run --frozen --project connectors/postgres aep-postgres-smoke
      - if: failure()
        run: docker compose logs source-postgres connector-postgres
      - if: always()
        run: docker compose down -v

  connector-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-source-admin
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sales
          MYSQL_USER: source_reader
          MYSQL_PASSWORD: local-source-reader
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --project connectors/mysql
      - run: uv run --frozen --project connectors/mysql ruff check connectors/mysql
      - run: uv run --frozen --project connectors/mysql ruff format --check connectors/mysql
      - name: Seed the synthetic MySQL source and SELECT-only account
        run: |
          docker exec -i -e MYSQL_PWD=local-source-admin ${{ job.services.mysql.id }} \
            mysql -uroot sales < connectors/mysql/seed/001-source.sql
          docker exec -i -e MYSQL_PWD=local-source-admin ${{ job.services.mysql.id }} \
            mysql -uroot sales < connectors/mysql/seed/002-reader.sql
      # The tests start a real HTTP listener and call all five MCP tools as well.
      - run: uv run --frozen --project connectors/mysql pytest connectors/mysql/tests -q
      - if: failure()
        run: docker logs ${{ job.services.mysql.id }}

  stack:
    # Boots the whole local stack the same way a developer does, then checks readiness.
    runs-on: ubuntu-latest
    needs: [backend, frontend, connectors, connector-mysql]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl -sf http://localhost:8000/readyz
      - name: Model call through the gateway (mock model)
        run: |
          curl -sf http://localhost:8000/llm/chat -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"hi"}]}' | grep -q "mock"
      - run: curl -sf http://localhost:3000 | grep -q "后端状态"
      - name: Run survives an API restart while waiting for approval
        run: scripts/smoke-runs.sh
      - name: The API image carries the Databricks CLI and its Terraform
        run: |
          docker compose exec -T api databricks --version
          docker compose exec -T api sh -c '"$DATABRICKS_TF_EXEC_PATH" version && cat "$DATABRICKS_TF_CLI_CONFIG_FILE"'
      - name: The sample data source is registered and its connector answers
        run: |
          id=$(curl -sf http://localhost:8000/datasources |
            python3 -c 'import json,sys; print(next(d["datasource_id"] for d in json.load(sys.stdin) if d["name"] == "示例库"))')
          curl -sf "http://localhost:8000/datasources/$id/tools" |
            python3 -c 'import json,sys; names = {t["name"] for t in json.load(sys.stdin)}; print(sorted(names)); assert {"describe_table", "sample_rows", "table_stats"} <= names'
      - name: MySQL is registered as the second source and exposes the same tools
        run: |
          id=$(curl -sf http://localhost:8000/datasources |
            python3 -c 'import json,sys; print(next(d["datasource_id"] for d in json.load(sys.stdin) if d["kind"] == "mysql" and d["name"] == "MySQL 示例库"))')
          curl -sf "http://localhost:8000/datasources/$id/tools" |
            python3 -c 'import json,sys; names = {t["name"] for t in json.load(sys.stdin)}; print(sorted(names)); assert names == {"list_schemas", "list_tables", "describe_table", "sample_rows", "table_stats"}'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  observability:
    # `make up-full`: the stack plus self-hosted Langfuse, then one traced run.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      LANGFUSE_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_SECRET_KEY: sk-lf-local-dev
      LANGFUSE_HOST: http://langfuse-web:3000
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile observability up --build -d --wait
      - name: One run is one Langfuse trace, model call included
        run: scripts/smoke-trace.sh
      - if: failure()
        run: docker compose --profile observability logs api litellm langfuse-web langfuse-worker
      - if: always()
        run: docker compose --profile observability down -v

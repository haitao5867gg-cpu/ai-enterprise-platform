# Local development stack: `make up` (or `make up-full` to add Langfuse tracing)
# Web UI http://localhost:3000 · API http://localhost:8000/docs · model gateway http://localhost:4000
# Langfuse (profile "observability") http://localhost:3100
name: aep

include:
  - infra/langfuse/compose.yml

# Tracing is on when both keys are set: `make up-full` sets them for the local
# Langfuse, or put Langfuse Cloud keys and LANGFUSE_HOST in .env.
x-langfuse-client: &langfuse-client
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}

services:
  source-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${AEP_SOURCE_MYSQL_ADMIN_PASSWORD:-local-source-admin}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: sales
      MYSQL_USER: source_reader
      MYSQL_PASSWORD: ${AEP_MYSQL_PASSWORD:-local-source-reader}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - source-mysql-data:/var/lib/mysql
      - ./connectors/mysql/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -uroot -e 'SELECT 1 FROM sales.orders LIMIT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  connector-mysql:
    build: ./connectors/mysql
    env_file:
      - path: .env
        required: false
    environment:
      AEP_MYSQL_HOST: source-mysql
      AEP_MYSQL_PORT: 3306
      AEP_MYSQL_DATABASE: sales
      AEP_MYSQL_USER: source_reader
      AEP_MYSQL_PASSWORD: ${AEP_MYSQL_PASSWORD:-local-source-reader}
      AEP_MYSQL_MCP_HOST: 0.0.0.0
      AEP_MYSQL_MCP_PORT: 8002
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      source-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SQL Server sample source (profile "sqlserver"; `make up-sqlserver`). The image is
  # about 1.5 GB and x86-64 only (Apple Silicon runs it under Rosetta), so it is not
  # part of `make up`. Register it on the data source page: kind SQL Server,
  # address http://connector-sqlserver:8007/mcp.
  source-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${AEP_SOURCE_SQLSERVER_ADMIN_PASSWORD:-Local-Source-Admin1}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - source-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Loads connectors/sqlserver/seed (the database once, the reader account every time).
  source-sqlserver-seed:
    build: ./connectors/sqlserver
    profiles: ["sqlserver"]
    command: ["aep-sqlserver-seed", "/seed"]
    environment:
      AEP_SQLSERVER_HOST: source-sqlserver
      AEP_SQLSERVER_PORT: 1433
      AEP_SQLSERVER_PASSWORD: ${AEP_SQLSERVER_PASSWORD:-Local-Source-Reader1}
      AEP_SOURCE_SQLSERVER_ADMIN_PASSWORD: ${AEP_SOURCE_SQLSERVER_ADMIN_PASSWORD:-Local-Source-Admin1}
    volumes:
      - ./connectors/sqlserver/seed:/seed:ro
    depends_on:
      source-sqlserver:
        condition: service_healthy
    restart: "no"

  connector-sqlserver:
    build: ./connectors/sqlserver
    profiles: ["sqlserver"]
    env_file:
      - path: .env
        required: false
    environment:
      AEP_SQLSERVER_HOST: source-sqlserver
      AEP_SQLSERVER_PORT: 1433
      AEP_SQLSERVER_DATABASE: source
      AEP_SQLSERVER_USER: source_reader
      AEP_SQLSERVER_PASSWORD: ${AEP_SQLSERVER_PASSWORD:-Local-Source-Reader1}
      AEP_SQLSERVER_MCP_HOST: 0.0.0.0
      AEP_SQLSERVER_MCP_PORT: 8007
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      source-sqlserver-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20
  source-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: ${AEP_SOURCE_POSTGRES_ADMIN_PASSWORD:-local-source-admin}
      POSTGRES_DB: aep_source
      AEP_POSTGRES_PASSWORD: ${AEP_POSTGRES_PASSWORD:-local-source-reader}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - source-postgres-data:/var/lib/postgresql/data
      - ./connectors/postgres/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U source_admin -d aep_source"]
      interval: 5s
      timeout: 3s
      retries: 20

  connector-postgres:
    build: ./connectors/postgres
    env_file:
      - path: .env
        required: false
    environment:
      AEP_POSTGRES_HOST: source-postgres
      AEP_POSTGRES_PORT: 5432
      AEP_POSTGRES_DATABASE: aep_source
      AEP_POSTGRES_USER: source_reader
      AEP_POSTGRES_PASSWORD: ${AEP_POSTGRES_PASSWORD:-local-source-reader}
      AEP_POSTGRES_MCP_HOST: 0.0.0.0
      AEP_POSTGRES_MCP_PORT: 8001
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      source-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Media processing (docs/api/media-processing.md): ffmpeg over MCP. It reads the media
  # libraries on the shared volume and writes only its own work folder there.
  connector-media:
    build: ./connectors/media
    environment:
      AEP_MEDIA_DIR: /data/media
      AEP_MEDIA_MCP_HOST: 0.0.0.0
      AEP_MEDIA_MCP_PORT: 8008
    volumes:
      - media-data:/data/media
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 语音转写（docs/api/transcription.md）：可选的本地 faster-whisper（speaches，CPU 版），
  # 模型网关的 transcribe 别名默认指向它。docker compose --profile asr up -d 才启动
  # （或在 .env 里写 COMPOSE_PROFILES=asr）。第一次启动时下载 ASR_MODEL 到 asr-models 卷，
  # 下完才算健康；以后直接用卷里的。
  asr:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: ["asr"]
    environment:
      ASR_MODEL: ${ASR_MODEL:-Systran/faster-whisper-small}
      ENABLE_UI: "false"
      # 模型一直留在内存里，每次转写不用重新加载。
      WHISPER__TTL: "-1"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    command:
      - sh
      - -c
      - >-
        (until curl -fsS http://localhost:8000/health >/dev/null 2>&1; do sleep 2; done;
        curl -fsS --retry 5 -X POST "http://localhost:8000/v1/models/$$ASR_MODEL") &
        exec uvicorn --factory speaches.main:create_app
    volumes:
      - asr-models:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8000/v1/models/$$ASR_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 900s

  connector-files:
    build: ./connectors/files
    environment:
      AEP_UPLOADS_DIR: ${AEP_UPLOADS_DIR:-/data/uploads}
      AEP_FILES_MCP_HOST: 0.0.0.0
      AEP_FILES_MCP_PORT: 8003
    volumes:
      - uploads:${AEP_UPLOADS_DIR:-/data/uploads}:ro
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Read-only Databricks tables (docs/api/datasources.md, "Databricks 数据源"). Not
  # registered by default: once configured, register it on the data sources page with
  # http://connector-databricks:8005/mcp. For development it falls back to the
  # platform's workspace, token and cluster; production uses a read-only identity.
  connector-databricks:
    build: ./connectors/databricks
    env_file:
      - path: .env
        required: false
    environment:
      AEP_DATABRICKS_READ_HOST: ${AEP_DATABRICKS_READ_HOST:-${AEP_DATABRICKS_HOST:-}}
      AEP_DATABRICKS_READ_TOKEN: ${AEP_DATABRICKS_READ_TOKEN:-${AEP_DATABRICKS_TOKEN:-}}
      AEP_DATABRICKS_READ_CLUSTER_ID: ${AEP_DATABRICKS_READ_CLUSTER_ID:-${AEP_DATABRICKS_CLUSTER_ID:-}}
      AEP_DATABRICKS_MCP_HOST: 0.0.0.0
      AEP_DATABRICKS_MCP_PORT: 8005
    ports:
      - "127.0.0.1:8005:8005"
    # /healthz does not reach Databricks (a statement every few seconds would keep a
    # warehouse or cluster from stopping); /healthz?probe=1 runs SELECT 1.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A code repository on GitHub or Bitbucket Data Center (docs/api/git.md): reads files
  # and proposes changes as pull requests from aep/ branches. Not registered by default:
  # once configured, register it on the data sources page as kind git with
  # http://connector-git:8006/mcp. Without its own settings it falls back to the assets
  # repository's (AEP_ASSETS_REPO, AEP_ASSETS_GITHUB_TOKEN).
  connector-git:
    build: ./connectors/git
    env_file:
      - path: .env
        required: false
    environment:
      AEP_GIT_TOKEN: ${AEP_GIT_TOKEN:-${AEP_ASSETS_GITHUB_TOKEN:-}}
      AEP_GIT_REPOS: ${AEP_GIT_REPOS:-${AEP_ASSETS_REPO:-}}
      AEP_GIT_MCP_HOST: 0.0.0.0
      AEP_GIT_MCP_PORT: 8006
    ports:
      - "127.0.0.1:8006:8006"
    # /healthz does not reach the Git host; /healthz?probe=1 reads each repository.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs code-node Python. Alone on the internal "sandbox" network: no internet, no
  # database, no API. The API reaches it through sandbox-relay, the only container on
  # both networks. See connectors/sandbox/README.md.
  connector-sandbox:
    build: ./connectors/sandbox
    environment:
      AEP_SANDBOX_MCP_HOST: 0.0.0.0
      AEP_SANDBOX_MCP_PORT: 8004
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox-relay:
    build: ./connectors/sandbox
    command: ["aep-sandbox-relay"]
    networks:
      - default
      - sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      connector-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aep
      POSTGRES_PASSWORD: aep
      POSTGRES_DB: aep
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aep -d aep"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    build: ./infra/litellm
    env_file:
      - path: .env
        required: false
    environment:
      <<: *langfuse-client
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-5}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-azure/gpt-5}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-2025-04-01-preview}
      BEDROCK_CLAUDE_MODEL: ${BEDROCK_CLAUDE_MODEL:-bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      QWEN_MODEL: ${QWEN_MODEL:-dashscope/qwen-plus}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-chat}
      COMPANY_MODEL: ${COMPANY_MODEL:-openai/deepseek-v4.1-flash-new}
      COMPANY_QWEN_MODEL: ${COMPANY_QWEN_MODEL:-openai/qwen3.8-max}
      COMPANY_VISION_MODEL: ${COMPANY_VISION_MODEL:-openai/qwen3.6-flash}
      COMPANY_EMBED_MODEL: ${COMPANY_EMBED_MODEL:-openai/text-embedding-v4}
      COMPANY_RERANK_MODEL: ${COMPANY_RERANK_MODEL:-hosted_vllm/gte-rerank-v2}
      # 语音转写（docs/api/transcription.md）：默认指向可选的本地转写服务 asr。
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-openai/${ASR_MODEL:-Systran/faster-whisper-small}}
      TRANSCRIBE_API_BASE: ${TRANSCRIBE_API_BASE:-http://asr:8000/v1}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-none}
      # Models added on the model page (docs/api/models.md): kept in a database of the
      # gateway's own on the platform's Postgres, their keys encrypted with the salt key.
      # Never change LITELLM_SALT_KEY once models are saved.
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://aep:aep@postgres:5432/litellm}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-local-dev-salt}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *langfuse-client
      AEP_DATABASE_URL: postgresql://aep:aep@postgres:5432/aep
      AEP_REDIS_URL: redis://redis:6379/0
      AEP_LLM_GATEWAY_URL: http://litellm:4000
      AEP_LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      AEP_UPLOADS_DIR: ${AEP_UPLOADS_DIR:-/data/uploads}
      AEP_KNOWLEDGE_DIR: /data/knowledge
      # Media libraries' files (docs/api/media.md).
      AEP_MEDIA_DIR: /data/media
      # Uploads are probed and get thumbnails there (docs/api/media-processing.md).
      AEP_MEDIA_CONNECTOR_URL: ${AEP_MEDIA_CONNECTOR_URL:-http://connector-media:8008/mcp}
      AEP_FILES_CONNECTOR_URL: ${AEP_FILES_CONNECTOR_URL:-http://connector-files:8003}
      AEP_SANDBOX_URL: ${AEP_SANDBOX_URL:-http://sandbox-relay:8004/mcp}
      # The assets repository's pull requests go through the Git connector (docs/api/git.md).
      AEP_ASSETS_GIT_URL: ${AEP_ASSETS_GIT_URL:-http://connector-git:8006/mcp}
      # Sample sources, registered through the existing startup mechanism.
      AEP_DEFAULT_DATASOURCES: >-
        [{"name": "示例库", "kind": "postgres", "connector_url": "http://connector-postgres:8001/mcp", "description": "本地示例源库：客户、商品、订单"},
         {"name": "MySQL 示例库", "kind": "mysql", "connector_url": "http://connector-mysql:8002/mcp", "description": "本地 MySQL 示例源库：sales（客户、商品、订单）和 retail（零售订单，演示用），都含脏数据"},
         {"name": "媒体处理", "kind": "mcp", "connector_url": "http://connector-media:8008/mcp", "description": "探测、抽帧和渲染媒体库里的视频、音频和图片（ffmpeg）"}]
      # Eval sets, for the eval a draft app version must pass before it is published.
      AEP_EVALS_DIR: /evals
      AEP_EVAL_DATASOURCE: ${AEP_EVAL_DATASOURCE:-示例库}
    volumes:
      - ./evals:/evals:ro
      - uploads:${AEP_UPLOADS_DIR:-/data/uploads}
      - knowledge-data:/data/knowledge
      - media-data:/data/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      connector-files:
        condition: service_healthy
      sandbox-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      AEP_API_INTERNAL_URL: http://api:8000
      # Browser-facing Langfuse URL/project; an empty UI URL hides the trace link.
      AEP_LANGFUSE_UI_URL: ${AEP_LANGFUSE_UI_URL-http://localhost:3100}
      AEP_LANGFUSE_PROJECT_ID: ${AEP_LANGFUSE_PROJECT_ID-aep-local}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

networks:
  sandbox:
    internal: true

volumes:
  postgres-data:
  source-postgres-data:
  source-mysql-data:
  source-sqlserver-data:
  uploads:
  knowledge-data:
  media-data:
  asr-models:

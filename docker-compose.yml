# Local development stack: `make up` (or `make up-full` to add Langfuse tracing)
# Web UI http://localhost:3000 · API http://localhost:8000/docs · model gateway http://localhost:4000
# Langfuse (profile "observability") http://localhost:3100
name: aep

include:
  - infra/langfuse/compose.yml

# Tracing is on when both keys are set: `make up-full` sets them for the local
# Langfuse, or put Langfuse Cloud keys and LANGFUSE_HOST in .env.
x-langfuse-client: &langfuse-client
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}

services:
  source-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: ${AEP_SOURCE_POSTGRES_ADMIN_PASSWORD:-local-source-admin}
      POSTGRES_DB: aep_source
      AEP_POSTGRES_PASSWORD: ${AEP_POSTGRES_PASSWORD:-local-source-reader}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - source-postgres-data:/var/lib/postgresql/data
      - ./connectors/postgres/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U source_admin -d aep_source"]
      interval: 5s
      timeout: 3s
      retries: 20

  connector-postgres:
    build: ./connectors/postgres
    env_file:
      - path: .env
        required: false
    environment:
      AEP_POSTGRES_HOST: source-postgres
      AEP_POSTGRES_PORT: 5432
      AEP_POSTGRES_DATABASE: aep_source
      AEP_POSTGRES_USER: source_reader
      AEP_POSTGRES_PASSWORD: ${AEP_POSTGRES_PASSWORD:-local-source-reader}
      AEP_POSTGRES_MCP_HOST: 0.0.0.0
      AEP_POSTGRES_MCP_PORT: 8001
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      source-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aep
      POSTGRES_PASSWORD: aep
      POSTGRES_DB: aep
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aep -d aep"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    build: ./infra/litellm
    env_file:
      - path: .env
        required: false
    environment:
      <<: *langfuse-client
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-5}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-azure/gpt-5}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-2025-04-01-preview}
      BEDROCK_CLAUDE_MODEL: ${BEDROCK_CLAUDE_MODEL:-bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      QWEN_MODEL: ${QWEN_MODEL:-dashscope/qwen-plus}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-chat}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *langfuse-client
      AEP_DATABASE_URL: postgresql://aep:aep@postgres:5432/aep
      AEP_REDIS_URL: redis://redis:6379/0
      AEP_LLM_GATEWAY_URL: http://litellm:4000
      AEP_LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      # The sample source database, through its read-only connector.
      AEP_DEFAULT_DATASOURCES: '[{"name": "示例库", "kind": "postgres", "connector_url": "http://connector-postgres:8001/mcp", "description": "本地示例源库：客户、商品、订单"}]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      AEP_API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  source-postgres-data:

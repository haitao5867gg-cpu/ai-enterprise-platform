[project]
name = "aep-git-connector"
version = "0.1.0"
description = "A code repository on GitHub or Bitbucket Data Center over MCP Streamable HTTP: read files, propose changes as pull requests"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16,<3",
    "mcp>=2,<3",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "starlette>=1.10,<2",
]

[project.scripts]
aep-git = "aep_git.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aep_git"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

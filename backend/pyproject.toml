[project]
name = "aep"
version = "0.1.0"
description = "AI Enterprise Platform API"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1,<0.43",
    "langfuse>=5,<6",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3,<3",
    "openai>=3.37.0",
    "openpyxl>=3.1,<4",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aep-eval = "aep.evals:main"
aep-demo = "aep.demo:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
